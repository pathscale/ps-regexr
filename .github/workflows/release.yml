name: Publish to crates.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crate-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubicloud-standard-2
    environment: crates-io
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Read manifest version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name == "ps-regexr") | .version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
      # A release with no changelog entry is a release nobody can read. A
      # prerelease is checked against the section of its base version.
      - name: Require a changelog section
        env:
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: bash scripts/ci/changelog_section.sh "$BASE_VERSION"
      # A crates.io version cannot be replaced, so a re-dispatch after a
      # successful upload skips the publish instead of failing on it.
      - name: Check whether this version is already published
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if curl -sf \
            -H "User-Agent: ps-regexr-ci (github.com/pathscale/ps-regexr)" \
            "https://crates.io/api/v1/crates/ps-regexr/${VERSION}" > /dev/null; then
            echo "ps-regexr@${VERSION} is already published, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # Without --no-verify, cargo builds the packaged tarball before uploading,
      # so a crate that does not build from its published contents is refused.
      - name: Publish reviewed manifest version
        if: steps.published.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --registry crates-io
